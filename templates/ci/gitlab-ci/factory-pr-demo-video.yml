# Records the e2e specs a merge request adds or changes on the test stack and adds the videos to a
# "Demo video" section of its description; backend-only changes get an "API changes" section instead.
# See docs/ai-pipeline/pr-demo-video.md in the factory. The test stack needs Docker: this job uses the
# docker:dind service, so its runner must allow privileged containers (override the job in your
# .gitlab-ci.yml for other runners). GitLab has no "merge request closed" event, so the videos of a closed,
# unmerged merge request stay on the videos branch until `factory pr-video cleanup --pr <iid>` is run.
factory-pr-demo-video:
  extends: .factory-mr
  timeout: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT != "true" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    PR_NUMBER: $CI_MERGE_REQUEST_IID
    HEAD_SHA: $CI_COMMIT_SHA
    RUN_URL: $CI_PIPELINE_URL
    BASE_REF: origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  script:
    - |
      list=$(factory pr-video specs --base "$BASE_REF" | paste -sd, -)
      scope=$(factory pr-video scope --base "$BASE_REF")
      eval "$scope"
      echo "Specs: ${list:-none}; $(echo $scope)"
      record=false; stack=false
      if [ -n "$list" ] && { [ "$video" = true ] || [ "$api" = true ]; }; then record=true; fi
      if { [ -n "$list" ] && [ "$video" = true ]; } || [ "$api" = true ]; then stack=true; fi
      if [ "$video" != true ]; then factory pr-video publish --pr "$PR_NUMBER" --remove; fi
      if [ "$video" = true ] && [ -z "$list" ]; then
        factory pr-video publish --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --run-url "$RUN_URL" --note "No \`e2e/teststack/*.spec.ts\` changed in this merge request, so there is no demo video. User-facing changes need one: see the factory's feature-demo-video skill."
      fi
      failed=false
      if [ "$stack" = true ]; then
        if [ -f .factory/ci/toolchain.sh ]; then . .factory/ci/toolchain.sh; fi
        apt-get update -qq && apt-get install -y -qq ffmpeg docker.io >/dev/null
        mkdir -p /usr/local/lib/docker/cli-plugins && curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose && chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
        npx playwright install --with-deps chromium
        factory teststack up
      fi
      if [ "$record" = true ]; then
        E2E_KEEP_VIDEOS=1 E2E_API_LOG=1 npx playwright test -c playwright.teststack.config.ts --project scenarios --no-deps ${list//,/ } || failed=true
      fi
      if [ "$record" = true ] && [ "$video" = true ]; then factory pr-video publish --pr "$PR_NUMBER" --specs "$list" --head-sha "$HEAD_SHA" --run-url "$RUN_URL"; fi
      factory pr-video api --pr "$PR_NUMBER" --base "$BASE_REF" --api "$api" --frontend "$frontend" --specs "$list" --head-sha "$HEAD_SHA" --run-url "$RUN_URL" || echo "Could not add the API summary."
      if [ "$failed" = true ]; then echo "A changed e2e spec failed; its video is marked failed in the description."; exit 1; fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/e2e-videos/
