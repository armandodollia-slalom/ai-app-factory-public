# The factory's pull request gate, without any LLM call: the generated files are in step with the engine
# version this repository pins, the configured models are allowed, test stack scenarios parse, the
# repository's linters pass on the changed lines, then the feature verification check.
# Create a pipeline from this file once (Pipelines > New pipeline > Existing YAML file). Azure Repos: add it
# as a required build validation in the target branch's policies (the `pr:` trigger below only applies to
# GitHub and Bitbucket repositories).
trigger: none
pr:
  branches:
    include: ['*']

pool:
  vmImage: ubuntu-latest

variables:
  FACTORY_CI: azure-pipelines

jobs:
- job: gate
  displayName: factory gate
  steps:
  - template: templates/factory-setup.yml
  - bash: |
      for v in $(env | sed -n 's/^\([A-Z_][A-Z0-9_]*\)=\$(.*/\1/p'); do unset "$v"; done
      factory check
      factory models check
      if [ -d .factory/stack ]; then
        # Yours: .factory/ci/toolchain.sh, for a stack published from the application (drift runs it).
        if [ -f .factory/ci/toolchain.sh ]; then . .factory/ci/toolchain.sh; fi
        factory teststack validate
        if node -e "process.exit(require('./.factory/config.json').teststack?.commands?.drift ? 0 : 1)"; then factory teststack drift; fi
      fi
    displayName: Generated files in step, models allowed, scenarios valid
    env:
      AZURE_DEVOPS_TOKEN: $(System.AccessToken)
      # factory:secrets

- job: lint
  displayName: factory lint
  steps:
  - template: templates/factory-setup.yml
  - bash: |
      for v in $(env | sed -n 's/^\([A-Z_][A-Z0-9_]*\)=\$(.*/\1/p'); do unset "$v"; done
      # Yours: .factory/ci/toolchain.sh installs this codebase's toolchain (written once by `factory init`).
      if [ -f .factory/ci/toolchain.sh ]; then . .factory/ci/toolchain.sh; fi
      factory lint --base "$BASE_REF"
    displayName: Lint the changed lines
    env:
      AZURE_DEVOPS_TOKEN: $(System.AccessToken)
      # factory:secrets

- job: feature_verification
  displayName: feature verification check
  dependsOn: gate
  steps:
  - template: templates/factory-setup.yml
  - bash: |
      for v in $(env | sed -n 's/^\([A-Z_][A-Z0-9_]*\)=\$(.*/\1/p'); do unset "$v"; done
      factory fv check --changed-from "$BASE_REF"
    displayName: Story plans and tests are verifier-approved
    env:
      AZURE_DEVOPS_TOKEN: $(System.AccessToken)
      # factory:secrets
